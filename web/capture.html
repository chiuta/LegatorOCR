<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LegatorOCR – captură</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#1b1b1b; --ok:#0a7d3b; --bad:#b3261e; --line:#c9c9c9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --ok:#4cc27f; --bad:#ff8a80; --line:#444; } }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  video, canvas, img { width:100%; max-height:60vh; object-fit:contain; border:1px solid var(--line); background:#000; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; align-items:center; }
  button, select { font:inherit; padding:10px 14px; }
  #verdict { font-weight:600; } .ok { color:var(--ok); } .bad { color:var(--bad); }
  #shots img { width:96px; height:128px; }
</style>
</head>
<body>
<main>
  <h1>LegatorOCR – captură de pagini</h1>
  <p>Totul rulează în browser, pe telefon: imaginea nu pleacă nicăieri. Verdictul de claritate se actualizează în timp real.</p>
  <video id="cam" autoplay playsinline muted></video>
  <div class="row"><span id="verdict">Camera nu e pornită.</span></div>
  <div class="row">
    <button id="start">Pornește camera</button>
    <button id="shoot" disabled>Fotografiază</button>
    <label>Cronometru <input id="secs" type="number" min="3" max="60" value="15" style="width:4em"> s</label>
    <button id="auto" disabled>Pornește cronometrul</button>
    <label>Mod <select id="mode"><option value="2">Alb-negru</option><option value="1">Tonuri de gri</option><option value="0">Color</option><option value="3">Mixt</option></select></label>
  </div>
  <h2>Pagini curățate</h2>
  <div class="row"><span id="timer"></span></div>
  <div class="row" id="shots"></div>
  <div class="row"><button id="save" disabled>Descarcă ultima pagină (PNG)</button></div>
  <p id="status" role="status"></p>
</main>
<script>
"use strict";
let wasm, last = null;
const $ = (id) => document.getElementById(id);
const status = (t) => { $("status").textContent = t; };

async function loadModule() {
  const r = await fetch("legatorocr_wasm.wasm");
  wasm = (await WebAssembly.instantiate(await r.arrayBuffer(), {})).instance.exports;
}
function put(bytes) {
  const p = wasm.lgr_alloc(bytes.length);
  new Uint8Array(wasm.memory.buffer, p, bytes.length).set(bytes);
  return p;
}
async function frameBytes(video, type, q) {
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  const blob = await new Promise((res) => c.toBlob(res, type, q));
  return new Uint8Array(await blob.arrayBuffer());
}
// sharpness is measured on a downscaled frame so the verdict stays instant
const SHARP_OK = 1500; // x1000 units; a starting value, not tuned on real phones
async function updateVerdict() {
  const v = $("cam");
  if (!wasm || !v.videoWidth) return;
  const c = document.createElement("canvas");
  const s = Math.min(1, 640 / v.videoWidth);
  c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.8));
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const p = put(bytes);
  const val = wasm.lgr_sharpness(p, bytes.length);
  wasm.lgr_free(p, bytes.length);
  const ok = val >= SHARP_OK;
  $("verdict").textContent = ok ? `Clar (${val})` : `Neclar – ține telefonul nemișcat (${val})`;
  $("verdict").className = ok ? "ok" : "bad";
}
$("start").onclick = async () => {
  try {
    await loadModule();
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 2560 } }, audio: false });
    $("cam").srcObject = stream;
    $("shoot").disabled = false; $("auto").disabled = false;
    setInterval(updateVerdict, 500);
    status("Camera pornită.");
  } catch (e) { status("Nu pot porni camera: " + e.message); }
};
// Timer: shoots every N seconds. A frame the page judges unusable (hand over the lens, dark,
// flat) is not kept and counts as a retake; after two retakes in the last six shots the interval
// grows by 2 s, after six clean shots in a row it shrinks by 1 s (never below 5 s).
let auto = null, left = 0, recent = [], clean = 0, busy = false;
const secsNow = () => { const n = Math.round(parseFloat($("secs").value)); return Number.isFinite(n) ? Math.min(60, Math.max(3, n)) : 15; }; // blank or text: 15 s
async function frameUsable() {
  const v = $("cam");
  if (!v.videoWidth || !v.videoHeight) return false; // no picture yet: nothing to keep
  const c = document.createElement("canvas");
  c.width = 64; c.height = Math.max(1, Math.round(64 * v.videoHeight / v.videoWidth));
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(v, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let a = 0, b = 0; const n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; a += l; b += l * l; }
  const mean = a / n, std = Math.sqrt(Math.max(0, b / n - mean * mean));
  return mean >= 30 && std >= 12;
}
function adapt(ok) {
  recent.push(ok); if (recent.length > 6) recent.shift();
  clean = ok ? clean + 1 : 0;
  let v = secsNow();
  if (recent.filter((r) => !r).length >= 2) { v = Math.min(60, v + 2); recent = []; clean = 0; }
  else if (clean >= 6) { v = Math.max(5, v - 1); clean = 0; }
  $("secs").value = v;
}
async function tick() {
  if (busy) return; // a slow shot must not overlap the next tick
  if (--left > 0) { $("timer").textContent = `Următoarea poză în ${left} s – așază cartea`; return; }
  busy = true;
  try {
    const ok = await frameUsable();
    adapt(ok);
    left = secsNow();
    if (!ok) { $("timer").textContent = `Cadru ratat (mână/întuneric) – nu se păstrează; reiau în ${left} s`; return; }
    await shoot();
  } catch (e) {
    left = secsNow(); status("Cronometru: " + e.message);
  } finally { busy = false; }
}
$("auto").onclick = () => {
  if (auto) { clearInterval(auto); auto = null; $("auto").textContent = "Pornește cronometrul"; $("timer").textContent = ""; return; }
  left = secsNow(); recent = []; clean = 0;
  auto = setInterval(tick, 1000); $("auto").textContent = "Oprește cronometrul";
};
let shooting = false;
async function shoot() {
  if (shooting) return; shooting = true;
  try { await shootOnce(); } finally { shooting = false; }
}
$("shoot").onclick = shoot;
async function shootOnce() {
  const bytes = await frameBytes($("cam"), "image/png");
  const p = put(bytes);
  const n = wasm.lgr_process(p, bytes.length, Number($("mode").value), 300);
  wasm.lgr_free(p, bytes.length);
  if (n < 0) { status("Pagina nu a putut fi procesată (" + n + ")."); return; }
  last = new Uint8Array(wasm.memory.buffer, wasm.lgr_out_ptr(), wasm.lgr_out_len()).slice();
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([last], { type: "image/png" }));
  $("shots").prepend(img);
  $("save").disabled = false;
  status(`Gata: ${n} pagină(i), ${last.length} octeți.`);
}
$("save").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([last], { type: "image/png" }));
  a.download = "pagina.png"; a.click();
};
</script>
</body>
</html>
