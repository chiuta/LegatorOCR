[package]
name = "legatorocr-engine"
description = "LegatorOCR engine: shared export orchestration (OCR + PDF) used by the CLI and the GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
legatorocr-core = { path = "../legatorocr-core" }
legatorocr-pdf = { path = "../legatorocr-pdf" }
legatorocr-ocr = { path = "../legatorocr-ocr", default-features = false }
legatorocr-nocr = { path = "../legatorocr-nocr", default-features = false }
anyhow.workspace = true
image.workspace = true
rayon.workspace = true
regex.workspace = true
tiff = "0.11"
flate2.workspace = true
getrandom = "0.4"
rqrr = "0.11.0"
djvu-rs = "0.44"
wasmi = "2.0.0"

[features]
default = ["lexicon", "builtin-model"]
lexicon = ["legatorocr-ocr/lexicon", "legatorocr-nocr/lexicon"]
builtin-model = ["legatorocr-ocr/builtin-model", "legatorocr-nocr/builtin-model"]

[dev-dependencies]
wat = "1"
