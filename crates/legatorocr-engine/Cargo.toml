[package]
name = "legatorocr-engine"
description = "LegatorOCR engine: shared export orchestration (OCR + PDF) used by the CLI and the GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
legatorocr-core = { path = "../legatorocr-core" }
legatorocr-pdf = { path = "../legatorocr-pdf" }
legatorocr-ocr = { path = "../legatorocr-ocr", default-features = false }
anyhow.workspace = true
image.workspace = true
rayon.workspace = true
regex.workspace = true
tiff = "0.11"
flate2.workspace = true
getrandom = "0.3"

[features]
default = ["lexicon"]
lexicon = ["legatorocr-ocr/lexicon"]
