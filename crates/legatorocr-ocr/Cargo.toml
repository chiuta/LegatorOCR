[package]
name = "legatorocr-ocr"
description = "LegatorOCR OCR: Tesseract (external engine) driver producing word boxes for the PDF text layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
legatorocr-core = { path = "../legatorocr-core" }
legatorocr-nocr = { path = "../legatorocr-nocr", default-features = false }
image.workspace = true
thiserror.workspace = true

[features]
default = ["lexicon"]
lexicon = ["legatorocr-nocr/lexicon"]
