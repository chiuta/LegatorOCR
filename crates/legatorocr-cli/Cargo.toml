[package]
name = "legatorocr-cli"
description = "LegatorOCR command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "legatorocr"
path = "src/main.rs"

[dependencies]
legatorocr-core = { path = "../legatorocr-core" }
legatorocr-engine = { path = "../legatorocr-engine", default-features = false }
image.workspace = true
clap.workspace = true
anyhow.workspace = true
rayon.workspace = true

[features]
default = ["lexicon", "builtin-model"]
lexicon = ["legatorocr-engine/lexicon"]
builtin-model = ["legatorocr-engine/builtin-model"]

[dev-dependencies]
wat = "1"
legatorocr-pdf = { path = "../legatorocr-pdf" }
