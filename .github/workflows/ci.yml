name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build (all crates, incl. GUI)
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Every option used in docs/tasks exists
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check-docs.py target/debug/legatorocr
      - name: Every option is documented (strict) and the rare ones run
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install pillow
          python3 scripts/check-options.py target/debug/legatorocr
          python3 scripts/smoke-options.py target/debug/legatorocr
      - name: Whole chain with the network cut off
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # the tool must work with no network at all (privacy claim): run it in an empty network namespace
          python3 - <<'PY'
          import struct
          w, h = 600, 800
          # a white page with dark text-like bars, written as a BMP so no image library is needed
          px = bytearray()
          for y in range(h - 1, -1, -1):
              for x in range(w):
                  dark = 100 < y < 700 and 80 < x < 520 and y % 40 < 12
                  px += b"\x00\x00\x00" if dark else b"\xff\xff\xff"
          hdr = b"BM" + struct.pack("<IHHI", 54 + len(px), 0, 0, 54) + struct.pack("<IiiHHIIiiII", 40, w, h, 1, 24, 0, len(px), 2835, 2835, 0, 0)
          open("page.bmp", "wb").write(hdr + bytes(px))
          PY
          sudo unshare -n target/debug/legatorocr page.bmp --pdf offline.pdf
          test -s offline.pdf
          head -c 5 offline.pdf | grep -q '%PDF-'
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          cargo clippy --locked --color never --workspace --all-targets -- -D warnings 2>&1 | tee clippy.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            # surface the diagnostics as annotations (readable without the raw job log)
            sed 's/\x1b\[[0-9;]*m//g' clippy.txt | grep -E '(error|warning)|--> ' | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$rc"

  ocr-regression:
    # synthetic pages with exact ground truth in 8 languages: guards against OCR / clean-up regressions
    # (not an accuracy claim for real scans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Tesseract, its language models, fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ron tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-ita tesseract-ocr-spa tesseract-ocr-por tesseract-ocr-deu tesseract-ocr-hun fonts-dejavu-core python3-pil djvulibre-bin
      - name: Build
        run: cargo build --locked --release -p legatorocr-cli
      - name: CER regression gate
        run: python3 scripts/ocr-bench.py target/release/legatorocr --engine tesseract --max-cer 0.3

  msrv:
    # the declared minimum Rust version must really build the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
      - name: Check with the minimum supported Rust version
        run: cargo check --locked --workspace

  wasm:
    # roadmap 7.7 / 7.11: the core builds for the browser and the module really works (run in Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the module
        run: cargo build --locked --release --target wasm32-unknown-unknown -p legatorocr-wasm
      - name: Run it in Node
        run: node web/test-wasm.mjs target/wasm32-unknown-unknown/release/legatorocr_wasm.wasm
      - name: Size
        run: ls -l target/wasm32-unknown-unknown/release/legatorocr_wasm.wasm | awk '{print $5, $9}'
      - name: Phone capture page in Chromium with a fake camera
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -loglevel error -y -loop 1 -i web/sample.png -t 2 -r 10 -vf scale=640:-2 -pix_fmt yuv420p "$RUNNER_TEMP/cam.y4m"
          mkdir "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/pw" && node "$GITHUB_WORKSPACE/web/test-capture.mjs" "$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/release/legatorocr_wasm.wasm" "$RUNNER_TEMP/cam.y4m"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: legatorocr-wasm
          path: target/wasm32-unknown-unknown/release/legatorocr_wasm.wasm
