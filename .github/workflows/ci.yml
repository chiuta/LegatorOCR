name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build (all crates, incl. GUI)
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          cargo clippy --locked --color never --workspace --all-targets -- -D warnings 2>&1 | tee clippy.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            # surface the diagnostics as annotations (readable without the raw job log)
            sed 's/\x1b\[[0-9;]*m//g' clippy.txt | grep -E '(error|warning)|--> ' | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$rc"

  msrv:
    # the declared minimum Rust version must really build the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
      - name: Check with the minimum supported Rust version
        run: cargo check --locked --workspace
