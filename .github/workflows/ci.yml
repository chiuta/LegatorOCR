name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (all crates, incl. GUI)
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee clippy.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            # surface the diagnostics as annotations (readable without the raw job log)
            grep -E '^(error|warning)|^ +--> ' clippy.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$rc"
