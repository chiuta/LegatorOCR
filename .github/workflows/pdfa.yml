name: PDF/A validation
# Runs the veraPDF validator over PDFs that LegatorOCR writes with --pdfa.
# PDF/A-2b is what --pdfa declares; any file that veraPDF rejects fails this job.
on:
  workflow_dispatch:
  push:
    paths: ["crates/legatorocr-pdf/**", ".github/workflows/pdfa.yml"]
  schedule:
    - cron: "41 4 * * 2"

jobs:
  verapdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y python3-pil tesseract-ocr tesseract-ocr-eng
      - name: Build
        run: cargo build --locked --release -p legatorocr-cli
      - name: Make sample PDF/A files
        run: |
          mkdir -p pdfa && cd pdfa
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import random
          random.seed(3)
          for name, mode in (("bw", "L"), ("color", "RGB")):
              im = Image.new(mode, (1240, 1754), 255 if mode == "L" else (238, 228, 205))
              d = ImageDraw.Draw(im)
              for i in range(25):
                  d.text((120, 140 + i * 55), "The quick brown fox jumps over the lazy dog %d" % i, fill=0 if mode == "L" else (20, 20, 40))
              if mode == "RGB":
                  d.rectangle((300, 1300, 900, 1600), fill=(180, 60, 40))
              im.save(name + ".png", dpi=(150, 150))
          PY
          B=../target/release/legatorocr
          $B bw.png    --mode bw    --pdfa --pdf bw_plain.pdf  -o o1
          $B bw.png    --mode bw    --pdfa --ocr --lang eng --pdf bw_ocr.pdf -o o2
          $B color.png --mode mixed --pdfa --pdf color_mixed.pdf -o o3
          $B color.png --mode color --pdfa --ocr --lang eng --pdf color_ocr.pdf -o o4
          $B color.png --mode hybrid --pdfa --pdf color_hybrid.pdf -o o5
          $B bw.png color.png --mode bw --pdfa --ocr --lang eng --pdf two_pages.pdf -o o6
          $B bw.png color.png --mode gray --pdfa --pdf gray_two.pdf -o o7
          ls -la *.pdf
      - name: Install veraPDF
        run: |
          set -x
          curl -fsSL -o vera.zip https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q vera.zip -d vera
          d=$(ls -d vera/verapdf-greenfield-* | head -1)
          cat > auto.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>/opt/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF Runtime" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          sed -i 's/^          //' auto.xml
          java -jar "$d"/verapdf-izpack-installer-*.jar auto.xml
          /opt/verapdf/verapdf --version
      - name: Validate against PDF/A-2b
        run: |
          cd pdfa
          /opt/verapdf/verapdf --flavour 2b --format text *.pdf | tee ../verapdf-report.txt
          /opt/verapdf/verapdf --flavour 2b --format xml  *.pdf > ../verapdf-report.xml || true
          ! grep -q '^FAIL' ../verapdf-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verapdf-report
          path: |
            verapdf-report.*
            pdfa/*.pdf
