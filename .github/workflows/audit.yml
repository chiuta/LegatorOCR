name: Security audit
# Known-vulnerability check of the dependency tree (RustSec advisory database) + licence/source policy.
on:
  push:
    paths: ["Cargo.lock", "**/Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml"]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
