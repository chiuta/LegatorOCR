name: Release
# Draft pre-release built only after the full CI matrix passes.
#  - push a tag `vX.Y.Z[-pre.N]`, or
#  - Actions > Release > Run workflow, entering the tag (the tag is created on the chosen commit).
# The release is always a DRAFT: review the assets, then press Publish on GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.2.0-pre.1"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "bad tag: $TAG"; exit 1;; esac
          scripts/package.sh "${{ matrix.target }}" "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: LegatorOCR-${{ matrix.target }}
          path: dist/LegatorOCR-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/LegatorOCR-*
          draft: true
          prerelease: ${{ inputs.prerelease != false }}
          generate_release_notes: true
