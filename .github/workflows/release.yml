name: Release
# Draft pre-release built only after the full CI matrix passes.
#  - push a tag `vX.Y.Z[-pre.N]`, or
#  - Actions > Release > Run workflow, entering the tag (the tag is created on the chosen commit).
# The release is always a DRAFT: review the assets, then press Publish on GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.2.0-pre.1"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # no build cache here: what ships is built from the checked-out sources only
      - name: Package
        shell: bash
        run: |
          # same strict shape as the release job; the tag becomes part of a path below
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "refusing unusual tag: $TAG"; exit 1; }
          # the tag must name the version in the code, and (for a re-run on an existing tag) its commit
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${TAG#v}" = "$ver" ] || { echo "tag $TAG does not match Cargo.toml version $ver"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA" ] || { echo "tag $TAG points at another commit than the one built"; exit 1; }
          fi
          scripts/package.sh "${{ matrix.target }}" "${TAG#v}"
      - name: Portability checks (fail the release instead of shipping an unrunnable binary)
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            *linux-gnu)
              # built on Ubuntu 22.04 (glibc 2.35): must not need anything newer
              for b in legatorocr legatorocr-gui; do
                v=$(objdump -T "target/${{ matrix.target }}/release/$b" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
                echo "$b needs $v"
                [ "$(printf '%s\n' "$v" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "glibc too new"; exit 1; }
              done;;
            *windows-msvc)
              for b in legatorocr legatorocr-gui; do
                if grep -aqi 'VCRUNTIME140' "target/${{ matrix.target }}/release/$b.exe"; then echo "$b.exe depends on the VC++ runtime DLL"; exit 1; fi
              done;;
          esac
      - name: Smoke test the packaged binary (runs it, not just links it)
        shell: bash
        run: |
          set -e
          exe="target/${{ matrix.target }}/release/legatorocr"
          case "${{ matrix.target }}" in *windows*) exe="$exe.exe";; esac
          "$exe" --version
          profiles=$("$exe" --list-profiles)
          test -n "$profiles"
          python3 - <<'PY'
          import struct, zlib
          w, h = 300, 400
          raw = b"".join(b"\x00" + bytes((0 if (x // 6 + y // 6) % 5 == 0 and 40 < x < 260 and 60 < y < 340 else 255) for x in range(w)) for y in range(h))
          def ch(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          open("smoke_in.png", "wb").write(b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 0, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw)) + ch(b"IEND", b""))
          PY
          "$exe" smoke_in.png --dpi 300 --pdf smoke_out.pdf -o smoke_out
          head -c 5 smoke_out.pdf | grep -q '%PDF-'
          test "$(wc -c < smoke_out.pdf)" -gt 500
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LegatorOCR-${{ matrix.target }}
          path: dist/LegatorOCR-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # the tag reaches the shell only through the environment, and only in a safe shape
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "refusing unusual tag"; exit 1; }
          f=".github/release-notes/${TAG}.md"
          # notes carry the known-limits statements: a release without them is not drafted
          [ -f "$f" ] || { echo "missing $f"; exit 1; }
          echo "path=$f" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Create (or refresh) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          # A draft with the same tag (left by an earlier run) is replaced; a PUBLISHED release is never touched.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | \"\(.id) \(.draft)\"" > existing.txt
          while read -r id draft; do
            [ -z "$id" ] && continue
            if [ "$draft" = true ]; then
              echo "removing old draft $id"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "release $TAG is already published; refusing to overwrite it"; exit 1
            fi
          done < existing.txt
          args=(--draft --target "$GITHUB_SHA" --title "LegatorOCR ${TAG#v}")
          # a version with a hyphen (0.2.0-pre.5) is always a pre-release
          if [ "$PRE" = true ] || [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          args+=(--notes-file "$NOTES")
          gh release create "$TAG" "${args[@]}" dist/LegatorOCR-*
          gh release view "$TAG" --json assets --jq '.assets|length' || true
