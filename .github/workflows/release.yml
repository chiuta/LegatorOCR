name: Release
# Draft pre-release built only after the full CI matrix passes.
#  - push a tag `vX.Y.Z[-pre.N]`, or
#  - Actions > Release > Run workflow, entering the tag (the tag is created on the chosen commit).
# The release is always a DRAFT: review the assets, then press Publish on GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.2.0-pre.1"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "bad tag: $TAG"; exit 1;; esac
          scripts/package.sh "${{ matrix.target }}" "${TAG#v}"
      - name: Portability checks (fail the release instead of shipping an unrunnable binary)
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            *linux-gnu)
              # built on Ubuntu 22.04 (glibc 2.35): must not need anything newer
              for b in legatorocr legatorocr-gui; do
                v=$(objdump -T "target/${{ matrix.target }}/release/$b" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
                echo "$b needs $v"
                [ "$(printf '%s\n' "$v" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "glibc too new"; exit 1; }
              done;;
            *windows-msvc)
              for b in legatorocr legatorocr-gui; do
                if grep -aqi 'VCRUNTIME140' "target/${{ matrix.target }}/release/$b.exe"; then echo "$b.exe depends on the VC++ runtime DLL"; exit 1; fi
              done;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: LegatorOCR-${{ matrix.target }}
          path: dist/LegatorOCR-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          f=".github/release-notes/${tag}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/LegatorOCR-*
          draft: true
          prerelease: ${{ inputs.prerelease != false }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
