[workspace]
resolver = "2"
members = ["crates/legatorocr-nocr", "crates/legatorocr-core", "crates/legatorocr-pdf", "crates/legatorocr-ocr", "crates/legatorocr-engine", "crates/legatorocr-cli", "crates/legatorocr-gui"]

# Shipped binaries keep integer-overflow checks: hostile files must stop with an error, not wrap
# silently into wrong sizes.
[profile.release]
overflow-checks = true

[workspace.package]
version = "0.2.0-pre.7"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Alexio <alexio@trom.tf>", "Alexandru Dumbravă"]
repository = "https://github.com/chiuta/legatorocr"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf"] }
